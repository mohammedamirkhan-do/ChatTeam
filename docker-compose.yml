services:
  mongo:
    image: mongo:7
    container_name: teamchat-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: teamchat
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: teamchat-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: teamchat-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweed:
        condition: service_started
    environment:
      PORT: 3000
      DATABASE_URL: mongodb://mongo:27017/teamchat
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
      JWT_SECRET: dev-only-change-me
      REFRESH_TOKEN_EXPIRES_IN_DAYS: 30
      S3_ENDPOINT: http://seaweed:8333
      S3_BUCKET: teamchat
      S3_REGION: us-east-1
      S3_ACCESS_KEY: teamchat
      S3_SECRET_KEY: teamchat-dev-only
      S3_FORCE_PATH_STYLE: 'true'
      FILE_MAX_MB: 50
    ports:
      - "3000:3000"
    volumes:
      - ./apps/server/src:/app/apps/server/src
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/version').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  desktop:
    build:
      context: .
      dockerfile: apps/desktop/Dockerfile
    container_name: teamchat-desktop
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/desktop/renderer:/app/apps/desktop/renderer
      - ./apps/desktop/electron:/app/apps/desktop/electron
      - ./apps/desktop/index.html:/app/apps/desktop/index.html

  seaweed:
    image: chrislusf/seaweedfs:latest
    container_name: teamchat-seaweed
    restart: unless-stopped
    command: server -dir=/data -master.volumeSizeLimitMB=256 -s3 -filer
    ports:
      - "8333:8333"
      - "18888:8888"
    volumes:
      - seaweeddata:/data

volumes:
  mongodata:
  seaweeddata: